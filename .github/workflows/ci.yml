name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile package and examples
        run: python -m compileall nanoevolve examples
      - name: Check release invariants
        run: python scripts/release_check.py --checks-only
      - name: Check module entry point
        run: python -m nanoevolve --version
      - name: Run deterministic demo
        run: python examples/hello_evolve/demo.py
      - name: Run roadmap showcase
        run: python examples/roadmap_showcase/demo.py

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Inspect distribution contents
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          source = next(Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = set(archive.namelist())
          assert "nanoevolve/py.typed" in wheel_names
          assert not any(name.startswith("tests/") for name in wheel_names)
          with tarfile.open(source) as archive:
              source_names = archive.getnames()
          required = (
              "README.zh-CN.md",
              "CONTRIBUTING.md",
              "SECURITY.md",
              "CHANGELOG.md",
              "examples/hello_evolve/demo.py",
              "examples/roadmap_showcase/demo.py",
              "scripts/release_check.py",
              "tests/test_engine.py",
          )
          for suffix in required:
              assert any(name.endswith(suffix) for name in source_names), suffix
          PY
      - name: Install wheel in clean environment
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/python -m nanoevolve --version
          .release-venv/bin/python - <<'PY'
          import importlib.metadata
          import nanoevolve

          assert (importlib.metadata.requires("nanoevolve") or []) == []
          assert nanoevolve.__version__ == importlib.metadata.version("nanoevolve")
          PY
      - name: Run installed demo and CLI smoke
        shell: bash
        run: |
          output=$(.release-venv/bin/python examples/hello_evolve/demo.py)
          echo "$output"
          project=$(echo "$output" | sed -n 's/^Project: //p')
          record=$(echo "$output" | sed -n 's/^Inspect: nanoevolve inspect .* \([^ ]*\)$/\1/p')
          .release-venv/bin/nanoevolve best "$project" --json
          .release-venv/bin/nanoevolve inspect "$project" "$record" --json
          .release-venv/bin/python examples/roadmap_showcase/demo.py
